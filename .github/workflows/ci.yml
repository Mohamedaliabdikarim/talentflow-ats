# Continuous integration: lint, type-check, unit tests, migration + RLS tests on an
# embedded PostgreSQL, production build, a guard that the service-role key name never
# appears in client bundles, and the Playwright smoke suite against the standalone build.
# Deployment is a separate, approval-gated workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm db:verify

      - run: pnpm build

      - name: Service-role key name must not reach client bundles
        run: |
          if grep -r "SUPABASE_SERVICE_ROLE_KEY" .next/static; then
            echo "Server-only environment variable referenced from a client bundle"
            exit 1
          fi

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
